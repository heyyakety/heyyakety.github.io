<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yakety Words of Inspiration</title>
  <meta name="description" content="A pep talk from Yakety, the YAC's favorite yak.">
  <link rel="icon" href="assets/yakety.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="stage">
    <header class="title">
      <h1><span class="title-name">Yakety</span> <span class="title-rest">Words of Inspiration</span></h1>
      <p class="subtitle">A pep talk from the YAC's favorite yak</p>
    </header>

    <div class="bubble" id="bubble">
      <p class="bubble-text">
        <span class="bubble-sizer" id="bubble-sizer" aria-hidden="true">Psst… tap me for a pick-me-up! 🐾</span>
        <span class="bubble-typed" id="bubble-typed">Psst… tap me for a pick-me-up! 🐾</span>
      </p>
    </div>
    <div class="sr-only" id="live" aria-live="polite"></div>

    <div class="device">
      <div class="device-ring" aria-hidden="true"></div>
      <div class="screen">
        <button class="yakety" id="yakety" type="button" aria-label="Tap Yakety for a pep talk">
          <svg class="yak-svg" viewBox="0 0 200 200" aria-hidden="true" focusable="false">
            <g transform="translate(100 100) scale(1.12) translate(-100 -100)">
              <ellipse class="shadow" cx="100" cy="170" rx="46" ry="6"/>
              <g class="yak-body">
                <!-- horns: drawn first so their bases tuck under the head -->
                <path class="horn" d="M66 68 C46 62 32 48 34 26 C48 38 62 44 84 50 Z"/>
                <path class="horn" d="M134 68 C154 62 168 48 166 26 C152 38 138 44 116 50 Z"/>
                <!-- floppy ears -->
                <ellipse class="fur-dark outline" cx="40" cy="98" rx="15" ry="9" transform="rotate(-28 40 98)"/>
                <ellipse class="fur-dark outline" cx="160" cy="98" rx="15" ry="9" transform="rotate(28 160 98)"/>
                <!-- stubby feet -->
                <ellipse class="fur-dark outline" cx="72" cy="154" rx="16" ry="11"/>
                <ellipse class="fur-dark outline" cx="128" cy="154" rx="16" ry="11"/>
                <!-- round chubby body with a scalloped fringe -->
                <path class="fur outline" d="M42 112 C42 66 66 46 100 46 C134 46 158 66 158 112 L158 134 A9.67 9.67 0 0 1 138.67 134 A9.67 9.67 0 0 1 119.33 134 A9.67 9.67 0 0 1 100 134 A9.67 9.67 0 0 1 80.67 134 A9.67 9.67 0 0 1 61.33 134 A9.67 9.67 0 0 1 42 134 Z"/>
                <!-- shaggy fringe: overlapping rounded tufts, none above the eyes -->
                <path class="fur-dark outline" d="M46 70 Q41 72 48 90 Q77 82 74 70 Q62.0 56 46 70 Z"/>
                <path class="fur-dark outline" d="M64 70 Q59 72 76 90 Q95 82 92 70 Q80.0 56 64 70 Z"/>
                <path class="fur-dark outline" d="M86 62 Q81 26 94 44 Q117 36 114 62 Q102.0 48 86 62 Z"/>
                <path class="fur-dark outline" d="M106 70 Q101 72 122 90 Q135 82 132 70 Q121.0 56 106 70 Z"/>
                <path class="fur-dark outline" d="M126 72 Q121 70 149 88 Q155 80 152 72 Q141.0 58 126 72 Z"/>
                <!-- glossy toy highlight, upper left -->
                <path class="shine" d="M60 80 C58 70 64 60 76 56"/>
                <!-- eyes -->
                <g class="eyes">
                  <ellipse class="eye" cx="76" cy="106" rx="9" ry="11"/>
                  <circle class="eye-shine" cx="79" cy="101" r="3.6"/>
                  <circle class="eye-shine" cx="72.5" cy="111" r="1.6"/>
                  <ellipse class="eye" cx="124" cy="106" rx="9" ry="11"/>
                  <circle class="eye-shine" cx="127" cy="101" r="3.6"/>
                  <circle class="eye-shine" cx="120.5" cy="111" r="1.6"/>
                </g>
                <!-- cheeks -->
                <ellipse class="cheek" cx="60" cy="122" rx="9" ry="5.5"/>
                <ellipse class="cheek" cx="140" cy="122" rx="9" ry="5.5"/>
                <!-- muzzle with nostrils, smile and open mouth -->
                <ellipse class="muzzle outline" cx="100" cy="124" rx="22" ry="13"/>
                <ellipse class="eye" cx="92" cy="119" rx="2.4" ry="1.8"/>
                <ellipse class="eye" cx="108" cy="119" rx="2.4" ry="1.8"/>
                <path class="mouth-closed" d="M90 132 q 10 8 20 0"/>
                <ellipse class="mouth-open" cx="100" cy="133" rx="6" ry="4.5"/>
                <!-- gold bell hanging below the muzzle -->
                <circle class="bell outline" cx="100" cy="148" r="6.5"/>
                <path class="bell-line" d="M97 150 h6"/>
              </g>
            </g>
          </svg>
        </button>
      </div>
      <div class="device-buttons" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>

    <footer class="footer"><span id="counter"></span></footer>
  </main>
  <div class="confetti" id="confetti" aria-hidden="true"></div>

  <script src="messages-data.js"></script>
  <script src="messages.js"></script>
  <script src="app.js"></script>
</body>
</html>
